name: Validate interview questions
on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'js/**'
      - 'css/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate question bank
        run: python scripts/validate_questions.py

      - name: Validate Java coding problems
        run: python scripts/validate_leetcode.py

      - name: Validate system-design tutorials and portal links
        run: python scripts/validate_system_design_tutorials.py
