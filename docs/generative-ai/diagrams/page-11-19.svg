<svg xmlns="http://www.w3.org/2000/svg" width="960" height="681" viewBox="0 0 960 681" role="img" aria-labelledby="title desc"><title id="title">Frozen weights plus a trainable low-rank update</title><desc id="desc">Input x → Frozen branch
