<svg xmlns="http://www.w3.org/2000/svg" width="960" height="986" viewBox="0 0 960 986" role="img" aria-labelledby="title desc"><title id="title">Secure and scalable application architecture</title><desc id="desc">User request + authenticated session → Gateway
Authenticate, rate-limit, reject oversized input → Application enforces tenant scope
Set deadline and token budget → Authorized retrieval
Document ACLs + version / LLM call
Minimum required context / Tenant-scoped cache
Scope + version + expiry → Validate evidence and output
Return answer or safe fallback → Redacted telemetry
