<svg xmlns="http://www.w3.org/2000/svg" width="960" height="969" viewBox="0 0 960 969" role="img" aria-labelledby="title desc"><title id="title">Fine-tuning from dataset to monitored deployment</title><desc id="desc">1. Prepare Dataset
Instruction, input-output pairs → 2. Preprocess Data
