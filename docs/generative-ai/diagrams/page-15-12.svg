<svg xmlns="http://www.w3.org/2000/svg" width="960" height="969" viewBox="0 0 960 969" role="img" aria-labelledby="title desc"><title id="title">Index documents and retrieve similar chunks</title><desc id="desc">Documents
Text, PDF, Web → 1. Split into Chunks
Smaller pieces, e.g. 500 tokens → 2. Generate Embeddings
Embedding model converts each chunk → 3. Store in Vector DB
Vectors + metadata → 4. Query Embedding
Search for similar chunks → 5. Retrieve Top K Similar Chunks
Rank by similarity score</desc><rect width="960" height="969" rx="20" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><text x="32" y="47" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Index documents and retrieve similar chunks</text><path d="M480.0 185 L480.0 239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480.0 329 L480.0 383" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480.0 473 L480.0 527" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480.0 617 L480.0 671" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480.0 761 L480.0 815" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="155.0" y="95" width="650" height="90" rx="13" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="480.0" y="134.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#1d4ed8">Documents</text><text x="480.0" y="159.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#1d4ed8">Text, PDF, Web</text><rect x="155.0" y="239" width="650" height="90" rx="13" fill="#d1fae5" stroke="#047857" stroke-width="2"/><text x="480.0" y="278.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#047857">1. Split into Chunks</text><text x="480.0" y="303.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#047857">Smaller pieces, e.g. 500 tokens</text><rect x="155.0" y="383" width="650" height="90" rx="13" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><text x="480.0" y="422.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#92400e">2. Generate Embeddings</text><text x="480.0" y="447.0" text-anchor="