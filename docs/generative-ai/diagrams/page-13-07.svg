<svg xmlns="http://www.w3.org/2000/svg" width="960" height="969" viewBox="0 0 960 969" role="img" aria-labelledby="title desc"><title id="title">Bounded agent workflow</title><desc id="desc">1. Understand User Goal
LLM interprets intent → 2. Plan Steps
Break down into small tasks → 3. Select and Use Tools
Call APIs, search, read files, run code → 4. Observe Results
Get output from tools → 5. Iterate
If needed, refine steps and repeat → 6. Final Answer
Return response to user</desc><rect width="960" height="969" rx="20" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><text x="32" y="47" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Bounded agent workflow</text><path d="M480.0 185 L480.0 239" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480.0 329 L480.0 383" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480.0 473 L480.0 527" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480.0 617 L480.0 671" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480.0 761 L480.0 815" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M805.0 716.0 H934 V428.0 H805.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="155.0" y="95" width="650" height="90" rx="13" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="480.0" y="134.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#1d4ed8">1. Understand User Goal</text><text x="480.0" y="159.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#1d4ed8">LLM interprets intent</text><rect x="155.0" y="239" width="650" height="90" rx="13" fill="#d1fae5" stroke="#047857" stroke-width="2"/><text x="480.0" y="278.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#047857">2. Plan Steps</text><text x="480.0" y="303.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#047857">Break down into small tasks</text><rect x="155.0" y="383" width="650" height="90" rx="13" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><text x="480.0" y="422.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#92400e">3. Select and Use Tools</text><text x="480.0" y="447.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#92400e">Call APIs, search, read files, run code</text><rect x="155.0" y="527" width="650" height="90" rx="13" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="480.0" y="566.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#6d28d9">4. Observe Results</text><text x="480.0" y="591.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#6d28d9">Get output from tools</text><rect x="155.0" y="671" width="650" height="90" rx="13" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text x="480.0" y="710.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#be123c">5. Iterate</text><text x="480.0" y="735.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#be123c">If needed, refine steps and repeat</text><rect x="155.0" y="815" width="650" height="90" rx="13" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><text x="480.0" y="854.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0e7490">6. Final Answer</text><text x="480.0" y="879.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0e7490">Return response to user</text></svg>