<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc"><title id="title">LRU cache: expected O(1) lookup and eviction</title><desc id="desc">Four-step illustrative design walkthrough.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#38bdf8"/></marker></defs>
<rect width="960" height="960" rx="18" fill="#0f172a"/>
<text x="35" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24">LRU cache: expected O(1) lookup and eviction</text>
<text x="35" y="80" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Follow the numbered responsibilities; process-local and distributed boundaries differ.</text>
<rect x="35" y="110" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="142" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">1. Find the node</text>
<text x="55" y="172" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Use the map to locate a key, returning empty on a miss.</text>
<path d="M480,254 L480,275" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="278" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="310" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">2. Refresh recency</text>
<text x="55" y="340" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Detach the found/updated node and insert it immediately after the head.</text>
<path d="M480,422 L480,443" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="446" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="478" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">3. Enforce capacity</text>
<text x="55" y="508" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">On new insert beyond capacity, remove tail.prev from both list and map.</text>
<path d="M480,590 L480,611" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="614" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="646" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">4. Check structural safety</text>
<text x="55" y="676" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Map/list membership and links must agree after every completed operation.</text>
<text x="35" y="818" fill="#fbbf24" font-family="Arial,sans-serif" font-size="19">Boundary / failure to explain</text>
<text x="35" y="848" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">Independent synchronization of map and list leaves races. A cached permission or price can still be</text>
<text x="35" y="869" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">stale. Decide cache validity separately from which entry is evicted.</text>
</svg>