<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc"><title id="title">Thread-safe HashMap: define atomic operations first</title><desc id="desc">Four-step illustrative design walkthrough.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#38bdf8"/></marker></defs>
<rect width="960" height="960" rx="18" fill="#0f172a"/>
<text x="35" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24">Thread-safe HashMap: define atomic operations first</text>
<text x="35" y="80" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Follow the numbered responsibilities; process-local and distributed boundaries differ.</text>
<rect x="35" y="110" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="142" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">1. Select a bucket</text>
<text x="55" y="172" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Use a stable key hash and floorMod; colliding keys still require equals checks.</text>
<path d="M480,254 L480,275" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="278" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="310" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">2. Acquire correct lock</text>
<text x="55" y="340" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Read for get, write for put/compute; always release in finally.</text>
<path d="M480,422 L480,443" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="446" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="478" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">3. Complete one atomic change</text>
<text x="55" y="508" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Read old value and write/remove the replacement within the same bucket lock.</text>
<path d="M480,590 L480,611" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="614" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="646" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">4. Coordinate a snapshot</text>
<text x="55" y="676" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Acquire all bucket read locks in fixed order to make a consistent copied view.</text>
<text x="35" y="818" fill="#fbbf24" font-family="Arial,sans-serif" font-size="19">Boundary / failure to explain</text>
<text x="35" y="848" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">Stripes improve parallelism only for keys spread across buckets. Hot keys remain contended. This in-</text>
<text x="35" y="869" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">memory map has no restart recovery and coordinates no separate processes.</text>
</svg>