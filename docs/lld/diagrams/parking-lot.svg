<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc"><title id="title">Parking lot: levels, gates and atomic slot assignment</title><desc id="desc">Four-step illustrative design walkthrough.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#38bdf8"/></marker></defs>
<rect width="960" height="960" rx="18" fill="#0f172a"/>
<text x="35" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24">Parking lot: levels, gates and atomic slot assignment</text>
<text x="35" y="80" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Follow the numbered responsibilities; process-local and distributed boundaries differ.</text>
<rect x="35" y="110" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="142" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">1. Validate entry</text>
<text x="55" y="172" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Check entry gate, vehicle kind and active plate before any slot mutation.</text>
<path d="M480,254 L480,275" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="278" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="310" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">2. Select a slot</text>
<text x="55" y="340" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Choose exact kind, nearest entry level, then stable slot ID from the free pool.</text>
<path d="M480,422 L480,443" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="446" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="478" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">3. Commit admission</text>
<text x="55" y="508" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Within the same lock, remove the slot and record vehicle plus ticket.</text>
<path d="M480,590 L480,611" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="614" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="646" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">4. Close through exit</text>
<text x="55" y="676" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Validate exit gate and active ticket, then release exactly that slot once.</text>
<text x="35" y="818" fill="#fbbf24" font-family="Arial,sans-serif" font-size="19">Boundary / failure to explain</text>
<text x="35" y="848" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">The coarse lock favors correctness over throughput. Do not hold it while calling a payment terminal.</text>
<text x="35" y="869" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">A real payment/exit workflow needs recorded states and recovery for payment success followed by gate</text>
<text x="35" y="890" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">failure.</text>
</svg>