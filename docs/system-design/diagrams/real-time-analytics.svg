<text x="40" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="bold">Real-time analytics — component view</text>
<text x="40" y="80" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Illustrative design • arrows label requests/data; return responses are omitted</text>
<path d="M310,187 L440,187" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="375.0" y="174" text-anchor="middle" fill="#f8fafc" stroke="#0f172a" stroke-width="6" paint-order="stroke" font-family="Arial,sans-serif" font-size="14">stable event IDs</text>
