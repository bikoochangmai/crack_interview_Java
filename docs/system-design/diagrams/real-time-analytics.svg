<rect x="440" y="425" width="270" height="125" rx="12" fill="#1e293b" stroke="#7dd3fc"/>
<text x="575" y="480" text-anchor="middle" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="21">Dashboard API</text>
<rect x="840" y="425" width="270" height="125" rx="12" fill="#1e293b" stroke="#7dd3fc"/>
