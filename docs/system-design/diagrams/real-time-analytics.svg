<path d="M975,250 L175,425" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="575.0" y="327.5" text-anchor="middle" fill="#f8fafc" stroke="#0f172a" stroke-width="6" paint-order="stroke" font-family="Arial,sans-serif" font-size="14">window updates</text>
<path d="M310,487 L440,487" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="375.0" y="456" text-anchor="middle" fill="#f8fafc" stroke="#0f172a" stroke-width="6" paint-order="stroke" font-family="Arial,sans-serif" font-size="14">precomputed</text><text x="375.0" y="474" text-anchor="middle" fill="#f8fafc" stroke="#0f172a" stroke-width="6" paint-order="stroke" font-family="Arial,sans-serif" font-size="14">metrics</text>
<path d="M710,487 L840,487" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="775.0" y="456" text-anchor="middle" fill="#f8fafc" stroke="#0f172a" stroke-width="6" paint-order="stroke" font-family="Arial,sans-serif" font-size="14">poll / stream</text><text x="775.0" y="474" text-anchor="middle" fill="#f8fafc" stroke="#0f172a" stroke-width="6" paint-order="stroke" font-family="Arial,sans-serif" font-size="14">results</text>
<rect x="40" y="125" width="270" height="125" rx="12" fill="#1e293b" stroke="#7dd3fc"/>
<text x="175" y="180" text-anchor="middle" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="21">Order event producer</text>
<rect x="440" y="125" width="270" height="125" rx="12" fill="#1e293b" stroke="#7dd3fc"/>
<text x="575" y="180" text-anchor="middle" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="21">Durable event log</text>
