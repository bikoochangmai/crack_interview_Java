<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Real-time analytics architecture</title><desc id="desc">Order event producer to Durable event log: stable event IDs; Durable event log to Stream processor: partitioned events; Stream processor to Aggregate store: window updates; Aggregate store to Dashboard API: precomputed metrics; Dashboard API to Business dashboard: poll / stream results</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#38bdf8"/></marker></defs>
