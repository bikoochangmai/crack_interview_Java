<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Short URL architecture</title><desc id="desc">Browser to Redirect API: GET /aB72; Redirect API to Mapping cache: lookup code; Redirect API to Link database: miss: read mapping; Redirect API to Click event queue: async click; Click event queue to Analytics worker: aggregate</desc>
