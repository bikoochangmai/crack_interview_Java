<path d="M575,250 L575,425" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="575.0" y="327.5" text-anchor="middle" fill="#f8fafc" stroke="#0f172a" stroke-width="6" paint-order="stroke" font-family="Arial,sans-serif" font-size="14">async click</text>
<path d="M710,487 L840,487" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="775.0" y="474" text-anchor="middle" fill="#f8fafc" stroke="#0f172a" stroke-width="6" paint-order="stroke" font-family="Arial,sans-serif" font-size="14">aggregate</text>
<rect x="40" y="125" width="270" height="125" rx="12" fill="#1e293b" stroke="#7dd3fc"/>
<text x="175" y="180" text-anchor="middle" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="21">Browser</text>
