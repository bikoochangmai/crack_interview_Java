<text x="575" y="180" text-anchor="middle" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="21">Redirect API</text>
<rect x="840" y="125" width="270" height="125" rx="12" fill="#1e293b" stroke="#7dd3fc"/>
<text x="975" y="180" text-anchor="middle" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="21">Mapping cache</text>
