<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc"><title id="title">Distributed key-value store: one ordered key history</title><desc id="desc">Four-step illustrative design walkthrough.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#38bdf8"/></marker></defs>
<rect width="960" height="960" rx="18" fill="#0f172a"/>
<text x="35" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24">Distributed key-value store: one ordered key history</text>
<text x="35" y="80" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Follow the numbered responsibilities; process-local and distributed boundaries differ.</text>
<rect x="35" y="110" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="142" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">1. Authenticate and route</text>
<text x="55" y="172" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Derive tenant/key and resolve the current authoritative shard owner.</text>
<path d="M480,254 L480,275" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="278" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="310" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">2. Order the write</text>
<text x="55" y="340" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">The leader orders a validated operation in its consensus-controlled durable log.</text>
<path d="M480,422 L480,443" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="446" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="478" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">3. Commit under the protocol</text>
<text x="55" y="508" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Use the chosen majority/commit rules, apply state and return a versioned result.</text>
<path d="M480,590 L480,611" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="614" width="890" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="55" y="646" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21">4. Read with declared consistency</text>
<text x="55" y="676" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Establish read authority for a strong read; do not silently substitute a stale follower.</text>
<text x="35" y="818" fill="#fbbf24" font-family="Arial,sans-serif" font-size="19">Boundary / failure to explain</text>
<text x="35" y="848" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">A timeout can hide a committed write. Preserve operation identity/version semantics. A minority</text>
<text x="35" y="869" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">cannot promise a strong write merely to stay responsive.</text>
</svg>