<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc"><title id="title">Distinguish an ETA from a price promise</title><desc id="desc">Collect signals → Estimate pickup → Store quote → Bind accepted terms. Illustrative sequence; conditions are explained in the steps.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#38bdf8"/></marker></defs>
<rect width="960" height="960" rx="18" fill="#0f172a"/>
<text x="40" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="bold">258. Distinguish an ETA from a price promise</text>
<text x="40" y="80" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Illustrative flow • follow steps 1–4 and check the conditions on each step</text>
<rect x="40" y="110" width="880" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="60" y="140" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="bold">1. Collect signals</text>
<text x="60" y="170" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Aggregate demand, supply and travel observations by area/window; detect stale inputs.</text>
<path d="M480,254 L480,275" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="278" width="880" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="60" y="308" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="bold">2. Estimate pickup</text>
<text x="60" y="338" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Route a shortlist and communicate uncertainty instead of a guaranteed arrival second.</text>
<path d="M480,422 L480,443" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="446" width="880" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="60" y="476" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="bold">3. Store quote</text>
<text x="60" y="506" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Apply a bounded, versioned policy and store quote ID, currency, terms and expiry.</text>
<path d="M480,590 L480,611" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="614" width="880" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="60" y="644" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="bold">4. Bind accepted terms</text>
<text x="60" y="674" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Accept an unexpired quote against its recorded terms; define any final-fare adjustment</text>
<text x="60" y="696" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">separately.</text>
<text x="40" y="818" fill="#fbbf24" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Failure / trade-off to explain</text>
<text x="40" y="848" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">Rapid feedback can cause oscillating prices. Define pricing and ETA fallback when data is unavailable</text>
<text x="40" y="869" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">and monitor prediction error.</text>
</svg>