<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc"><title id="title">Strangler Fig: replace one capability at a time</title><desc id="desc">Keep stable entry point → Route one owner → Validate before expansion → Rollback deliberately. This is an illustrative pattern walkthrough.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#38bdf8"/></marker></defs>
<rect width="960" height="960" rx="18" fill="#0f172a"/>
<text x="40" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="bold">273. Strangler Fig: replace one capability at a time</text>
<text x="40" y="80" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Follow the numbered roles • these are learning steps, not separate network services</text>
<rect x="40" y="110" width="880" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="60" y="140" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="bold">1. Keep stable entry point</text>
<text x="60" y="170" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Clients call one Documents API; routing policy identifies eligible migrated entities.</text>
<path d="M480,254 L480,275" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="278" width="880" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="60" y="308" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="bold">2. Route one owner</text>
<text x="60" y="338" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">The demo routes document 42 to modern and other IDs to legacy; these are alternatives, not</text>
<text x="60" y="360" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">both calls.</text>
<path d="M480,422 L480,443" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="446" width="880" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="60" y="476" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="bold">3. Validate before expansion</text>
<text x="60" y="506" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">Check content, ACL and version parity plus errors and latency before adding more entities.</text>
<path d="M480,590 L480,611" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="614" width="880" height="142" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="60" y="644" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="bold">4. Rollback deliberately</text>
<text x="60" y="674" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">The lab can revert routing only. A real rollback after writes requires data synchronization</text>
<text x="60" y="696" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17">and ownership recovery.</text>
<text x="40" y="818" fill="#fbbf24" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Boundary / failure to explain</text>
<text x="40" y="848" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">Two live paths increase operational complexity. A routing facade can become a bottleneck. Big-bang</text>
<text x="40" y="869" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">replacement may be reasonable for a small isolated system, but do not assume gradual routing solves</text>
<text x="40" y="890" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">dual writes.</text>
</svg>